<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГРУША ДРОП ЗАКРЫТ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: clamp(32px, 8vw, 96px);
            font-weight: 900;
            letter-spacing: 2px;
            color: #8bc34a;
            text-shadow: 0 0 20px rgba(139, 195, 74, 0.5);
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <h1>ГРУША ДРОП ЗАКРЫТ</h1>
</body>
</html>
